<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Department Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container mt-5">

    <div class="main-card">

        <div th:if="${errorMessage}"
     class="alert alert-danger"
     role="alert"
     th:text="${errorMessage}">
</div>

    <script>
    setTimeout(function () {

        const message = document.querySelector('.alert-danger');

        if (message) {
            message.style.transition = "opacity 0.5s";
            message.style.opacity = "0";

            setTimeout(function () {
                message.remove();
            }, 500);
        }

    }, 3000);
</script>

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="page-title">
                    Department Management
                </h2>

                <p class="page-subtitle">
                    Manage Departments Efficiently
                </p>

            </div>

            <a href="/departments/add"
               class="btn btn-primary">

                Add Department

            </a>

        </div>

                <!-- ===========================
             Search Department
        ============================ -->

        <form th:action="@{/departments/search}"
              method="get"
              class="mb-4">

            <div class="row">

                <div class="col-md-10">

                    <input type="text"
                           name="departmentName"
                           class="form-control"
                           placeholder="Search Department">

                </div>

                <div class="col-md-2">

                    <button type="submit"
                            class="btn btn-primary w-100">

                        Search

                    </button>

                </div>

            </div>

        </form>

        <!-- ===========================
             Department Table
        ============================ -->

        <div class="table-responsive">

            <table class="table table-bordered table-hover table-striped">

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Department Name</th>
                        <th>Employees</th>
                        <th>Action</th> 
                    </tr>

                </thead>

                <tbody>
                                        <tr th:each="department : ${departments}">

                        <td th:text="${department.id}"></td>

                        <td th:text="${department.departmentName}"></td>
    <td th:text="${department.employees != null ? department.employees.size() : 0}">
</td>

                        <td class="text-center">

                            <a th:href="@{/departments/edit/{id}(id=${department.id})}"
                               class="btn btn-warning btn-sm me-2">

                                Edit

                            </a>

                            

                            <a th:href="@{/departments/delete/{id}(id=${department.id})}"
                               class="btn btn-danger btn-sm">

                                Delete

                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(departments)}">

                        <td colspan="4"
                            class="text-center text-danger fw-bold">

                            No Department Found

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
