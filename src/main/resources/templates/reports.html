<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Reports & Analytics</title>

    <!-- Existing Finecore360 CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="main-card reports-page">

    <!-- Page Title -->
    <h1 class="page-title">
        Reports & Analytics
    </h1>

    <p class="page-subtitle">
        Overview of employee, attendance, leave and payroll data
    </p>


    <!-- =====================================
         SUMMARY CARDS
         ===================================== -->

    <div class="report-cards">


        <!-- Total Employees -->
        <div class="report-card">

            <h3>Total Employees</h3>

            <p th:text="${totalEmployees}">
                0
            </p>

        </div>


        <!-- Total Salary -->
        <div class="report-card">

            <h3>Total Salary</h3>

            <p th:text="${totalSalary}">
                0
            </p>

        </div>


        <!-- Total Attendance -->
        <div class="report-card">

            <h3>Total Attendance</h3>

            <p th:text="${totalAttendance}">
                0
            </p>

        </div>


        <!-- Total Leaves -->
        <div class="report-card">

            <h3>Total Leaves</h3>

            <p th:text="${totalLeaves}">
                0
            </p>

        </div>


        <!-- Total Payroll -->
        <div class="report-card">

            <h3>Total Payroll Records</h3>

            <p th:text="${totalPayrolls}">
                0
            </p>

        </div>

    </div>


    <!-- =====================================
         REPORT INFORMATION
         ===================================== -->

    <div class="report-section">

        <h2>
            System Overview
        </h2>

        <p>
            This dashboard provides a quick overview of
            employee management, attendance, leave and payroll data.
        </p>

    </div>

</div>

</body>

</html>
