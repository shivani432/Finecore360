<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Attendance Management</title>

    <!-- Existing Finecore360 CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="main-card attendance-page">

    <!-- Page Title -->
    <h1 class="page-title">
        Attendance Management
    </h1>

    <!-- Page Subtitle -->
    <p class="page-subtitle">
        Manage employee attendance efficiently with Finecore360
    </p>


    <!-- =========================
         ATTENDANCE FORM
         ========================= -->

    <form class="attendance-form"
          th:action="@{/attendance/save}"
          method="post">

        <div class="attendance-form-scroll">

            <!-- Employee -->
            <div class="attendance-field">
                <label>Employee</label>

                <select name="employee.id" required>
                    <option value="">Select Employee</option>

                    <option th:each="employee : ${employees}"
                            th:value="${employee.id}"
                            th:text="${employee.name}">
                    </option>
                </select>
            </div>


            <!-- Date -->
            <div class="attendance-field">
                <label>Date</label>

                <input type="date"
                       name="date"
                       required>
            </div>


            <!-- Status -->
            <div class="attendance-field">
                <label>Status</label>

                <select name="status" required>
                    <option value="">Select Status</option>
                    <option value="PRESENT">Present</option>
                    <option value="ABSENT">Absent</option>
                    <option value="HALF_DAY">Half Day</option>
                </select>
            </div>


            <!-- Check In -->
            <div class="attendance-field">
                <label>Check In</label>

                <input type="time"
                       name="checkInTime">
            </div>


            <!-- Check Out -->
            <div class="attendance-field">
                <label>Check Out</label>

                <input type="time"
                       name="checkOutTime">
            </div>


            <!-- Save Button -->
            <div class="attendance-button">
                <button type="submit">
                    Save Attendance
                </button>
            </div>

        </div>

    </form>


    <!-- =========================
         ATTENDANCE RECORDS
         ========================= -->

    <h2 class="attendance-heading">
        Attendance Records
    </h2>


    <div class="attendance-table-wrapper">

        <table class="table attendance-table">

            <thead>
            <tr>
                <th>ID</th>
                <th>Employee</th>
                <th>Date</th>
                <th>Status</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <!-- Display all Attendance records -->
            <tr th:each="attendance : ${attendances}">

                <td th:text="${attendance.id}"></td>

                <td th:text="${attendance.employee.name}"></td>

                <td th:text="${attendance.date}"></td>

                <td th:text="${attendance.status}"></td>

                <td th:text="${attendance.checkInTime}"></td>

                <td th:text="${attendance.checkOutTime}"></td>

                <td class="attendance-actions">

                    <!-- Edit button -->
                   <a th:href="@{/attendance-edit/{id}(id=${attendance.id})}"
   class="edit-btn">
    Edit
</a>

                    <!-- Delete button -->
                  <button type="button"
        class="delete-btn"
        th:onclick="'deleteAttendance(' + ${attendance.id} + ')'">
    Delete
</button>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>
<script>

function deleteAttendance(id) {

    if (!confirm("Are you sure you want to delete this attendance?")) {
        return;
    }

    fetch("/attendance/" + id, {
        method: "DELETE"
    })
    .then(response => {

        if (response.ok) {
            window.location.reload();
        } else {
            alert("Delete failed");
        }

    })
    .catch(error => {
        alert("Something went wrong");
        console.error(error);
    });
}

</script>
</body>
</html>
