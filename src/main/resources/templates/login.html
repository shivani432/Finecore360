<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Finecore360 | Login</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Existing Finecore360 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>

<div class="container mt-5">

    <div class="main-card login-card">

        <!-- =====================================
             LOGIN PAGE HEADING
             ===================================== -->

        <div class="text-center mb-4">

            <h2 class="page-title">
                Finecore360
            </h2>

            <p class="page-subtitle">
                Employee Management System
            </p>

        </div>
        <!-- Login failed message -->
<div th:if="${param.error}"
     class="alert alert-danger text-center">
    Invalid email or password
</div>

        <!-- =====================================
             LOGIN FORM
             ===================================== -->

        <form th:action="@{/login}"
              method="post">

            <!-- Email -->
            <div class="mb-3">

                <label for="email"
                       class="form-label">
                    Email
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       required>

            </div>


            <!-- Password -->
            <div class="mb-3">

                <label for="password"
                       class="form-label">
                    Password
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>

            </div>


            <!-- Login Button -->
            <div class="d-grid">

                <button type="submit"
                        class="btn btn-primary">

                    Login

                </button>

            </div>

        </form>


        <!-- Register Link -->

        <div class="text-center mt-3">

            <p>
                Don't have an account?

                <a th:href="@{/register}">
                    Register
                </a>
            </p>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
