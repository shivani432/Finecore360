<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">    

<h2 class="text-center mb-4"
    th:text="${employee.id != 0 ? 'Update Employee' : 'Add Employee'}">
</h2>

<form th:action="@{/save}" th:object="${employee}" method="post">
    
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
    <label>Name :</label>
    <input type="text" th:field="*{name}" class="form-control">
    <div class="text-danger"
     th:if="${#fields.hasErrors('name')}"
     th:errors="*{name}">
    </div>
</div>

    <div class="mb-3">
    <label>Email :</label>
    <input type="email" th:field="*{email}" class="form-control">
    <div class="text-danger"
     th:if="${#fields.hasErrors('email')}"
     th:errors="*{email}">
</div>
 </div>

    <div class="mb-3">
    <label>Department :</label>
    <input type="text" th:field="*{department}" class="form-control">
    <div class="text-danger"
     th:if="${#fields.hasErrors('department')}"
     th:errors="*{department}">
</div>
 </div>

    <div class="mb-3">
    <label>Salary :</label>
    <input type="number" th:field="*{salary}" class="form-control"><br><br>
    <div class="text-danger"
     th:if="${#fields.hasErrors('salary')}"
     th:errors="*{salary}">
</div>
 </div>

    <button type="submit" class="btn btn-success w-100"
        th:text="${employee.id != 0 ? 'Update Employee' : 'Save Employee'}">
</button>
    <a href="/" class="btn btn-secondary w-100 mt-2">
    Back
    </a>

</form>
        </div>

    </div>

</div>

</body>
</html>
